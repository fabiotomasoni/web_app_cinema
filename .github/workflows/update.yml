name: Aggiorna programmazione
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: programmazione
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python scripts/update.py
      - name: Salva dati aggiornati
        run: |
          git config user.name 'CinemaHub Bot'
          git config user.email 'cinemahub@users.noreply.github.com'
          git add docs/data/schedule.json
          git diff --staged --quiet || git commit -m "Aggiorna programmazione"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: update
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Pubblica GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
